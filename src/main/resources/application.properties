spring.application.name=DocumentGateway
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bewerbungsprojekt}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

routing.routes[partner-a.invoice].receiver-id=receiver-mock-a
routing.routes[partner-a.invoice].target-url=http://localhost:8081/mock-a

routing.routes[partner-b.invoice].receiver-id=receiver-mock-b
routing.routes[partner-b.invoice].target-url=http://localhost:8081/mock-b

gateway.api-keys.partner-a=test-api-key
gateway.api-keys.partner-b=test-api-key

# Max. POST-Body (Tomcat Connector maxPostSize)
server.tomcat.max-http-form-post-size=1MB
