name: DAST
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build JAR
        run: mvn -B package -DskipTests
      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD_TEST }}
          DB_HOST=db
          EOF
      - name: Start application stack
        run: docker compose up -d --build
      - name: Wait for app to be healthy
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:8080/actuator/health && break
            echo "Waiting... ($i)"
            sleep 5
          done
      - name: Verify app reachable from container
        run: docker run --rm curlimages/curl curl -sf http://172.17.0.1:8080/actuator/health
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://172.17.0.1:8080'
          fail_action: false
      - name: Stop stack
        if: always()
        run: docker compose down