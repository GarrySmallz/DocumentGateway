name: DAST
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build JAR
        run: mvn -B package -DskipTests
      - name: Create .env from secrets
        run: |
          echo "DB_NAME=bewerbungsprojekt" >> .env
          echo "DB_USER=appuser" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_TEST }}" >> .env
          echo "DB_HOST=db" >> .env
      - name: Start application stack
        run: docker compose up -d --build
      - name: Show container status
        run: docker compose ps
      - name: Show app logs
        run: docker compose logs app
      - name: Show db logs
        run: docker compose logs db
      - name: Wait for app to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "App is healthy after $i attempts"
              exit 0
            fi
            echo "Attempt $i/30 failed"
            sleep 5
          done
          echo "ERROR: App never became healthy"
          docker compose logs app
          exit 1
      - name: "[DEBUG] Container status after wait"
        run: docker compose ps
      - name: "[DEBUG] App logs after wait"
        run: docker compose logs --tail=50 app
      - name: "[DEBUG] DB logs after wait"
        run: docker compose logs --tail=20 db
      - name: "[DEBUG] Check if app port is listening"
        run: ss -tlnp | grep 8080 || echo "NOTHING on 8080"
      - name: Verify app reachable from container
        run: docker run --rm --network host curlimages/curl curl -sf http://172.17.0.1:8080/actuator/health
      - name: Get Docker host IP
        run: echo "DOCKER_HOST_IP=$(docker network inspect bridge --format='{{range .IPAM.Config}}{{.Gateway}}{{end}}')" >> $GITHUB_ENV
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://${{ env.DOCKER_HOST_IP }}:8080'
          fail_action: false
      - name: Stop stack
        if: always()
        run: docker compose down