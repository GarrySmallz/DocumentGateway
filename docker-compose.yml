services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11
    container_name: mariadb-dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mariadb -u root -prootpass -e 'SELECT 1' 2>/dev/null || exit 1" ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 15
  adminer:
    image: adminer
    container_name: adminer-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
volumes:
  mariadb_data: